# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: verbalreality
description: >
  An AI agent that builds an interactive 3D scene by generating Babylon.js
  JavaScript from natural language. The web client runs the returned code in a
  live WebGL canvas; the scene is cumulative across turns.
metadata:
  authors:
    - Microsoft
  tags:
    - Azure AI AgentServer
    - Microsoft Agent Framework
    - Babylon.js
    - 3D Scene Creation
protocols:
  - protocol: responses
    version: 1.0.0
  # Real-time voice (preview, North Central US only). The container serves the voice
  # WebSocket frame protocol; the platform relays raw text/binary frames to it.
  - protocol: invocations_ws
    version: 1.0.0
environment_variables:
  - name: PROJECT_ENDPOINT
    value: "{{PROJECT_ENDPOINT}}"
  - name: MODEL_DEPLOYMENT_NAME
    value: "{{MODEL_DEPLOYMENT_NAME}}"
  # The validation tool calls a Node Babylon NullEngine service. In this image that
  # service is co-hosted alongside the Python agent (see Dockerfile + start.sh) and
  # listens on localhost:8087, so server-side validation is ENABLED for hosted deploys.
  - name: ENABLE_VALIDATION
    value: "true"
  - name: VALIDATOR_URL
    value: "http://localhost:8087/validate"
  # Capture every failing validate_babylon_code attempt (code + error + prompt) to the
  # micro-VM disk and emit OpenTelemetry error events + structured logs for evaluation.
  - name: CAPTURE_VALIDATION_FAILURES
    value: "true"
  # --- Voice (cascaded Azure Speech STT -> agent -> TTS of prose only) ---
  # Enabled only when an Azure Speech resource is configured. Prefer keyless auth: grant
  # the agent's Entra identity the "Cognitive Services Speech User" role on the Speech /
  # AI Services resource and set SPEECH_REGION (no SPEECH_KEY needed). Alternatively set
  # SPEECH_KEY for key-based auth. Deploy in North Central US for the invocations_ws preview.
  - name: ENABLE_VOICE
    value: "true"
  - name: SPEECH_REGION
    value: "{{SPEECH_REGION}}"
  # Full ARM resource id of the AIServices/Speech resource. Required for KEYLESS auth
  # (the Speech SDK uses the aad#<resourceId>#<token> form): grant the agent's Entra
  # identity the "Cognitive Services User" (or "Cognitive Services Speech User") role on it.
  - name: SPEECH_RESOURCE_ID
    value: "{{SPEECH_RESOURCE_ID}}"
  # HD neural voice for a more natural reply. `…MultilingualNeuralHD` voices are the HD tier
  # available in North Central US. The marquee DragonHD voices are NOT in NCUS; if you deploy
  # the Speech resource in a DragonHD region (SEA/IN/SW/WE/EUS/EUS2/WUS2) you can set
  # SPEECH_VOICE_NAME to e.g. "en-US-Ava:DragonHDLatestNeural". Unsupported voices fall back
  # to SPEECH_VOICE_FALLBACK so audio is never lost.
  - name: SPEECH_VOICE_NAME
    value: "en-US-NovaMultilingualNeuralHD"
  - name: SPEECH_VOICE_FALLBACK
    value: "en-US-AvaMultilingualNeural"
  - name: VOICE_WS_PORT
    value: "8089"
dockerfile_path: Dockerfile
resources:
  # Bumped from 1.0/2.0Gi to fit Python + Node + Babylon.js running together.
  cpu: '2.0'
  memory: 4.0Gi
