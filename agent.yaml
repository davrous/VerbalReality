# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: verbalreality
description: >
  An AI agent that builds an interactive 3D scene by generating Babylon.js
  JavaScript from natural language. The web client runs the returned code in a
  live WebGL canvas; the scene is cumulative across turns.
metadata:
  authors:
    - Microsoft
  tags:
    - Azure AI AgentServer
    - Microsoft Agent Framework
    - Babylon.js
    - 3D Scene Creation
protocols:
  - protocol: responses
    version: 1.0.0
environment_variables:
  - name: PROJECT_ENDPOINT
    value: "{{PROJECT_ENDPOINT}}"
  - name: MODEL_DEPLOYMENT_NAME
    value: "{{MODEL_DEPLOYMENT_NAME}}"
  # The validation tool calls a Node Babylon NullEngine service. In this image that
  # service is co-hosted alongside the Python agent (see Dockerfile + start.sh) and
  # listens on localhost:8087, so server-side validation is ENABLED for hosted deploys.
  - name: ENABLE_VALIDATION
    value: "true"
  - name: VALIDATOR_URL
    value: "http://localhost:8087/validate"
dockerfile_path: Dockerfile
resources:
  # Bumped from 1.0/2.0Gi to fit Python + Node + Babylon.js running together.
  cpu: '1.0'
  memory: 2.0Gi
