<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verbal Reality — a Babylon 3D Agent</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="canvas-pane">
        <canvas id="renderCanvas" touch-action="none"></canvas>
        <div id="viewport-controls" role="group" aria-label="Viewport controls">
          <div class="vc-row">
            <span class="vc-label">Scene</span>
            <div class="vc-seg" id="mode-seg" role="group" aria-label="Scene mode">
              <button
                type="button"
                class="vc-btn active"
                data-mode="automatic"
                aria-pressed="true"
                title="Automatic — objects are scaled to a consistent size and the camera frames them."
              >
                Auto
              </button>
              <button
                type="button"
                class="vc-btn"
                data-mode="default"
                aria-pressed="false"
                title="Manual — your exact sizes/positions are kept and the camera stays put (used in VR)."
              >
                Manual
              </button>
            </div>
          </div>
          <div class="vc-row vc-disabled" id="camera-row">
            <span class="vc-label">Camera</span>
            <div class="vc-seg" id="camera-seg" role="group" aria-label="Camera type">
              <button
                type="button"
                class="vc-btn active"
                data-cam="arcrotate"
                aria-pressed="true"
                title="Orbit camera — drag to rotate around the scene."
              >
                Orbit
              </button>
              <button
                type="button"
                class="vc-btn"
                data-cam="fps"
                aria-pressed="false"
                title="Walk camera — WASD / arrows to move, drag to look around."
              >
                Walk
              </button>
            </div>
          </div>
        </div>
      </div>
      <div id="chat-resizer" role="separator" aria-orientation="vertical" title="Drag to resize chat">
        <span id="chat-resizer-grip"></span>
      </div>
      <div id="chat-pane">
        <header id="chat-header">
          <h1>
            <img id="chat-wordmark" src="VerbalRealityWordmark.png" alt="Verbal Reality" />
          </h1>
          <img id="app-logo" src="VerbalRealityHead.png" alt="Verbal Reality logo" />
          <label id="agent-target-label" for="agent-target" title="Choose which agent answers">
            <select id="agent-target" aria-label="Agent target">
              <option value="local" selected>Local agent</option>
              <option value="remote">Foundry (remote)</option>
            </select>
          </label>
          <button
            id="voice-toggle"
            type="button"
            aria-pressed="false"
            title="Voice mode OFF — click to enable, then hold V to talk."
          >
            <span aria-hidden="true">🎙️</span>
            <span class="sr-only">Toggle voice mode</span>
          </button>
          <span id="status-dot" title="agent status"></span>
        </header>
        <div id="messages" aria-live="polite"></div>
        <form id="chat-form" autocomplete="off">
          <textarea
            id="chat-input"
            rows="2"
            placeholder="Describe the 3D scene to build…  (type /reset to clear)"
          ></textarea>
          <button id="send-btn" type="submit">Send</button>
        </form>
      </div>
    </div>
    <script src="activity.js"></script>
    <script src="scenefit.js"></script>
    <script src="editmode.js"></script>
    <script src="voice.js"></script>
    <script src="app.js"></script>
  </body>
</html>
